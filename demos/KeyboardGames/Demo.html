
<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">
        <style>
            html {
                height: 100%;
            }
            body {
                margin: 0;
                padding: 0;
                font-family: 'Courier New', Courier, monospace;
                position: relative;
                width: 100%;
                height: 100%;
                z-index: 1;
            }
            .main {
                display: flex;
                flex-direction: column;
                align-items: center;
                height: fit-content;
                min-height: 100vh;
                overflow-x: hidden;
                background-color: #000;
            }
            button {
                font-family: 'Courier New', Courier, monospace;
                font-size: 1.25rem;
                font-weight: 800;
                padding: 0.5rem 1rem;
                border: 2px solid white;
                background-color: transparent;
                color: white;
                cursor: pointer;
                transition: 0.3s;
                transition: transform 0.3s ease-in-out;
                border-radius: 5px;
            }
            button:hover {
                background-color: white;
                color: black;
                transform: scale(1.05);
                box-shadow: 0 0 7.5px rgb(0 0 0 / 75%);
            }
            .dot, #dot {
                width: 17.5px;
                height: 17.5px;
                border-radius: 50%;
                border: 1.5px solid white;
            }

            #modal-backdrop {
                height: 100vh;
                display: none;
                width: 100%;
                overflow: hidden;
                position: fixed;
                z-index: 10;
                top: 0;
                left: 0;
                background-color: rgba(0, 0, 0, 0.5);
            }
            .site-name {
                font-family: "Fugaz One", serif;
                color: #0075e2;
                font-size: 3.5rem;
                box-shadow: 0 0 7.5px rgb(255 255 255);
                padding: .5rem .75rem;
                border-radius: 5px;
                text-shadow: 3px 3px rgb(0 255 242 / 75%);
                background-color: #1d1d1d;
                cursor: default;
                user-select: none;
            }

            .home-btn {
                position: absolute;
                top: 10px;
                right: 15px;
                z-index: 20;
            }
            .auth-btns {
                position: absolute;
                top: 10px;
                left: 15px;
                z-index: 20;
                display: flex;
                gap: 1rem;
                align-items: center;
                justify-content: center;
            }
            .site-name {
                margin-top: 1.5rem;
            }
        </style>
        <style>
            .main {
                gap: 4rem;
            }
            .pages {
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                width: 100%;
                gap: 3rem;
                flex-wrap: wrap;
                margin-bottom: 4rem;
            }
            .circle-page {
                width: 100%;
                height: fit-content;
                cursor: pointer;
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }
            .img-wrapper {
                width: 300px;
                height: fit-content;
                position: relative;
            }
            .circle-page img {
                width: 100%;
                height: auto;
                overflow: hidden;
                border-radius: 10px;
                border: 2px solid white;
            }
            .img-overlay {
                position: absolute;
                top: 0;
                width: 102.5%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.25);
                border-radius: 10px;
            }
            .circle-page:hover img {
                border: 5px solid white;
                margin: -3px;
            }
            .circle-page:hover .img-overlay {
                background-color: transparent;
            }
            h1 {
                color: white;
                font-size: 5rem;
                font-weight: 800;
                margin: 0;
            }
            h2 {
                color: white;;
                font-size: 1.65rem;
                font-weight: 800;
                margin: 0;
                text-decoration: none;
                text-align: center;
            }
            a {
                text-decoration: none;
                width: max(325px, 20%);
            }


        </style>
    </head>
    <body>
        <div class="main">
            <h1 class='site-name'>Keyboard Games</h1>
            <div class="pages">
                <a href="./TheFirstOne.html">
                    <div class="circle-page">
                        <div class='img-wrapper'>
                            <img src="./imgs/first_one.png">
                            <div class='img-overlay'></div>
                        </div>
                        <h2>The First One</h2>
                    </div>
                </a>
                <a href="./DisappearingCircles.html">
                    <div class="circle-page">
                        <div class='img-wrapper'>
                            <img src="./imgs/disappearing_circles.png">
                            <div class='img-overlay'></div>
                        </div>
                        <h2>Disappearing Circles</h2>
                    </div>
                </a>
                <a href="./DisappearingDot.html">
                    <div class="circle-page">
                        <div class='img-wrapper'>
                            <img src="./imgs/disappearing_dot.png">
                            <div class='img-overlay'></div>
                        </div>
                        <h2>Disappearing Dot</h2>
                    </div>
                </a>
                <a href="./ShrinkingCircles.html">
                    <div class="circle-page">
                        <div class='img-wrapper'>
                            <img src="./imgs/shrinking_circles.png">
                            <div class='img-overlay'></div>
                        </div>
                        <h2>Shrinking Circles</h2>
                    </div>
                </a>
                <a href="./MovingCircles.html">
                    <div class="circle-page">
                        <div class='img-wrapper'>
                            <img src="./imgs/moving_circles.png">
                            <div class='img-overlay'></div>
                        </div>
                        <h2>Moving Circles</h2>
                    </div>
                </a>
            </div>
        </div>
    </body>
</html>
