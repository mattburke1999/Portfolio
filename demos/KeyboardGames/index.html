
<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./static/css/theme.css">
        <link rel="stylesheet" href="./static/css/index.css">
        <style>
            .main {
                gap: 4rem;
            }
            .pages {
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                width: 100%;
                gap: 3rem;
                flex-wrap: wrap;
                margin-bottom: 4rem;
            }
            .circle-page {
                width: 100%;
                height: fit-content;
                cursor: pointer;
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }
            .img-wrapper {
                width: 300px;
                height: fit-content;
                position: relative;
            }
            .circle-page img {
                width: 100%;
                height: auto;
                overflow: hidden;
                border-radius: 10px;
                border: 2px solid white;
            }
            .img-overlay {
                position: absolute;
                top: 0;
                width: 102.5%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.25);
                border-radius: 10px;
            }
            .circle-page:hover img {
                border: 5px solid white;
                margin: -3px;
            }
            .circle-page:hover .img-overlay {
                background-color: transparent;
            }
            h1 {
                color: white;
                font-size: 5rem;
                font-weight: 800;
                margin: 0;
            }
            h2 {
                color: white;;
                font-size: 1.65rem;
                font-weight: 800;
                margin: 0;
                text-decoration: none;
                text-align: center;
            }
            a {
                text-decoration: none;
                width: max(325px, 20%);
            }


        </style>
    </head>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F9SDZVX3WZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-F9SDZVX3WZ');
</script>
    <body>
        <div class="main">
            <div class="auth-btns">
                <a href="/demos/KeyboardGames/skins/">
                    <button>Skins</button>
                </a>
            </div>
            <h1 class='site-name'>Keyboard Games</h1>
            <div class="pages">
                <div class='circle-page-btn' data-href="./TheFirstOne.html">
                    <div class="circle-page">
                        <div class='img-wrapper'>
                            <img src="./imgs/first_one.png">
                            <div class='img-overlay'></div>
                        </div>
                        <h2>The First One</h2>
                    </div>
                </div>
                <div class='circle-page-btn' data-href="./DisappearingCircles.html">
                    <div class="circle-page">
                        <div class='img-wrapper'>
                            <img src="./imgs/disappearing_circles.png">
                            <div class='img-overlay'></div>
                        </div>
                        <h2>Disappearing Circles</h2>
                    </div>
                </div>
                <div class='circle-page-btn' data-href="./DisappearingDot.html">
                    <div class="circle-page">
                        <div class='img-wrapper'>
                            <img src="./imgs/disappearing_dot.png">
                            <div class='img-overlay'></div>
                        </div>
                        <h2>Disappearing Dot</h2>
                    </div>
                </div>
                <div class='circle-page-btn' data-href="./ShrinkingCircles.html">
                    <div class="circle-page">
                        <div class='img-wrapper'>
                            <img src="./imgs/shrinking_circles.png">
                            <div class='img-overlay'></div>
                        </div>
                        <h2>Shrinking Circles</h2>
                    </div>
                </div>
                <div class='circle-page-btn' data-href="./MovingCircles.html">
                    <div class="circle-page">
                        <div class='img-wrapper'>
                            <img src="./imgs/moving_circles.png">
                            <div class='img-overlay'></div>
                        </div>
                        <h2>Moving Circles</h2>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script>
        $('.circle-page-btn').each(function() {
            let inputSet = false;

            const setInputAndNavigate = (type) => {
                if (inputSet) return;
                inputSet = true;
                console.log('Setting input type to: ', type);
                localStorage.setItem('keyboardGamesInput', type);
                const href = this.getAttribute('data-href');
                $('.site-name').text('Keyboard Games - ' + type);
                setTimeout(() => {
                    $('.site-name').text('Keyboard Games');
                    window.location.href = href;
                }, 7000);
            };

            this.addEventListener('touchstart', () => setInputAndNavigate('touch'));
            this.addEventListener('click', () => setInputAndNavigate('mouse'));
        })
    </script>
</html>
