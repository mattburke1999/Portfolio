<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>games</title>
    <link rel="stylesheet" href="./index-D_Vr6EuB.css">
    <style>
html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}
#app {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    height: 100vh;
    overflow: hidden;
}
a {
  color: inherit;
  background-color: #ccc;
  border-radius: 10px;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 1.25rem;
  text-decoration: none;
  transition: transform 0.3s;
  display: flex;
}
a:hover {
  transform: scale(1.05);
}
span {
  font-size: 1.25rem;
  font-weight: 700;
  text-decoration: underline;
}
img {
  object-fit: cover;
  border: 5px solid #5a5a5a;
  border-radius: 10px;
  width: 250px;
  height: 325px;
  box-shadow: 0 4px 8px #0003;
}
@media (width<=768px) {
  a {
    padding: 0.75rem;
  }
  img {
    width: 125px;
    height: 175px;
  }
}
</style>
  </head>
  <body>
    <div id="app">
      <a href="/games/jumper/">
        <img src="./images/jumper.png" alt="jumper" />
        <span>Platform Jumper</span>
      </a>
      <a href="/games/solitaire/">
        <img src="./images/solitaire.png" alt="solitaire" />
        <span>Solitaire</span>
      </a>
      <a href="/games/sodoku/">
        <img src="./images/sodoku.png" alt="sodoku" />
        <span>Sodoku</span>
      </a>
    </div>
  </body>
</html>
