<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>games</title>
    <link rel="stylesheet" href="./styles.css">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js', {
                scope: '/games/'
            })
            .then((registration) => {
                console.log('SW registered', registration.scope);
            })
            .catch((err) => {
                console.error('SW registration failed', err);
            });
        });
    }
    </script>
  </head>
  <body>
    <div id="app">
      <a href="./jumper/index.html">
        <img src="./images/jumper.png" alt="jumper" />
        <span>Platform Jumper</span>
      </a>
      <a href="./solitaire/index.html">
        <img src="./images/solitaire.png" alt="solitaire" />
        <span>Solitaire</span>
      </a>
      <a href="./sudoku/index.html">
        <img src="./images/sudoku.png" alt="sudoku" />
        <span>Sudoku</span>
      </a>
      <a href="./fruit-merge/index.html">
        <img src="./images/fruit-merge.png" alt="fruit-merge" />
        <span>Fruit Merge</span>
      </a>
    </div>
  </body>
</html>
